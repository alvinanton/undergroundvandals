name: Deploy to Dev-Server (Ubuntu)

on:
  push:
    branches:
      - main
      - feat/platform-update-and-docker
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Stack via Docker Compose
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Containers
        run: |
          cp ~/.env.undergroundvandals .env
          docker compose up -d --build --remove-orphans
          docker image prune -f