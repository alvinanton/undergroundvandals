name: Deploy to Dev-Server (Ubuntu)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev-server
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Migrate and deploy stack
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load environment file
        run: cp ~/.env.undergroundvandals .env

      - name: Validate deployment configuration
        run: |
          set -a; source .env; set +a
          for name in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_SECRET JWT_ISSUER JWT_AUDIENCE AZURE_STORAGE_CONNECTION_STRING PUBLIC_API_URL SITE_ORIGIN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required setting is missing: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$SITE_ORIGIN" =~ ^https?://[^/]+/?$ ]]; then
            echo "SITE_ORIGIN must be the browser-facing origin without a path." >&2
            exit 1
          fi
          docker compose config --quiet

      - name: Export app settings for EF tooling
        run: |
          set -a; source .env; set +a
          {
            echo "ASPNETCORE_ENVIRONMENT=Development"
            echo "ConnectionStrings__DefaultConnection=Host=localhost;Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
            echo "AzureStorageSettings__ConnectionString=${AZURE_STORAGE_CONNECTION_STRING}"
            echo "AzureStorageSettings__AccountName=${AZURE_STORAGE_ACCOUNT_NAME}"
            echo "JwtSettings__Secret=${JWT_SECRET}"
            echo "JwtSettings__Issuer=${JWT_ISSUER}"
            echo "JwtSettings__Audience=${JWT_AUDIENCE}"
          } >> "$GITHUB_ENV"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x

      - name: Restore pinned EF tooling
        working-directory: backend/UndergroundVandals
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore backend/UndergroundVandals/UndergroundVandals.Api/UndergroundVandals.Api.csproj

      - name: Build EF migration bundle
        working-directory: backend/UndergroundVandals
        run: |
          dotnet tool run dotnet-ef migrations bundle \
            --project UndergroundVandals.Api \
            --startup-project UndergroundVandals.Api \
            --self-contained -r linux-x64 \
            --output ../../efbundle --force

      - name: Build application images before migrating
        run: docker compose build api bot frontend

      - name: Ensure PostgreSQL is running and healthy
        run: docker compose up -d --wait --wait-timeout 120 db

      - name: Back up database before migrating
        run: |
          set -a; source .env; set +a
          mkdir -p ~/backups/undergroundvandals
          docker compose exec -T -e PGPASSWORD="$POSTGRES_PASSWORD" db pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" \
            | gzip > ~/backups/undergroundvandals/pre-migration-$(date +%Y%m%d-%H%M%S).sql.gz
          ls -1t ~/backups/undergroundvandals/*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm --

      - name: Apply migrations
        run: |
          chmod +x ./efbundle
          ./efbundle --connection "$ConnectionStrings__DefaultConnection"

      - name: Deploy containers
        run: docker compose up -d --no-build --wait --wait-timeout 120 --remove-orphans

      - name: Verify API and frontend readiness
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors --connect-timeout 3 --max-time 10 http://127.0.0.1:5050/healthz
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors --connect-timeout 3 --max-time 10 http://127.0.0.1:4321/healthz

      - name: Clean up unused images
        run: docker image prune -f
