name: Deploy .NET API to Azure App Service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'

env:
  AZURE_WEBAPP_NAME: 'underground-vandals-api'
  PROJECT_PATH: 'backend/UndergroundVandals/UndergroundVandals.Api/UndergroundVandals.Api.csproj'
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build project
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

    - name: Publish project
      run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish --no-build

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish