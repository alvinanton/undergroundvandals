name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/**'
              - '.github/scripts/**'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/**'
              - '.github/scripts/**'

  infrastructure:
    name: Infrastructure
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose with example settings
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            docker compose --env-file .env.example --file docker-compose.yml config --quiet

      - name: Validate GitHub Actions workflows
        run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.github,target=/work/.github,readonly" \
            --workdir /work \
            rhysd/actionlint:1.7.12 -color "${workflows[@]}"

      - name: Validate deployment shell scripts
        run: |
          shopt -s nullglob
          scripts=(.github/scripts/*.sh)
          if (( ${#scripts[@]} > 0 )); then
            docker run --rm --network none \
              --mount "type=bind,source=$GITHUB_WORKSPACE/.github,target=/work/.github,readonly" \
              --workdir /work --entrypoint shellcheck \
              rhysd/actionlint:1.7.12 "${scripts[@]}"
          fi

  backend:
    name: Backend (.NET)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend/UndergroundVandals
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UndergroundVandals.slnx

      - name: Build
        run: dotnet build UndergroundVandals.slnx --no-restore -c Release

      - name: Test
        run: dotnet test UndergroundVandals.slnx --no-build -c Release

  frontend:
    name: Frontend (Astro)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
