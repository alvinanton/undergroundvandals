name: Deploy to Production (Azure)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-azure
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build, back up, migrate, and deploy production
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    environment:
      name: Production
      url: ${{ vars.API_BASE_URL }}
    env:
      POSTGRES_IMAGE: postgres:18-alpine
      AZURE_CLI_IMAGE: mcr.microsoft.com/azure-cli:azurelinux3.0
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      BOT_BASE_URL: ${{ vars.BOT_BASE_URL }}
    steps:
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production releases must be started from main." >&2
            exit 1
          fi

      - name: Initialize temporary paths
        run: |
          {
            echo "RELEASE_DIR=$RUNNER_TEMP/production-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "BACKUP_DIR=$RUNNER_TEMP/production-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$RUNNER_TEMP/production-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate production settings
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          AZURE_BOT_PUBLISH_PROFILE: ${{ secrets.AZURE_BOT_PUBLISH_PROFILE }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production releases must be started from main." >&2
            exit 1
          fi
          for name in DATABASE_CONNECTION_STRING PRODUCTION_DATABASE_URL AZURE_STORAGE_CONNECTION_STRING AZURE_WEBAPP_PUBLISH_PROFILE AZURE_BOT_PUBLISH_PROFILE API_BASE_URL BOT_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required Production setting is missing: $name" >&2
              exit 1
            fi
          done
          for name in API_BASE_URL BOT_BASE_URL; do
            if [[ ! "${!name}" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]; then
              echo "$name must be an HTTPS origin without a path or trailing slash." >&2
              exit 1
            fi
          done
          docker info > /dev/null
          curl --version > /dev/null

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x

      - name: Restore pinned EF tooling
        working-directory: backend/UndergroundVandals
        run: dotnet tool restore

      - name: Restore dependencies
        working-directory: backend/UndergroundVandals
        run: dotnet restore UndergroundVandals.slnx

      - name: Build release
        working-directory: backend/UndergroundVandals
        run: dotnet build UndergroundVandals.slnx --no-restore -c Release

      - name: Run tests
        working-directory: backend/UndergroundVandals
        run: dotnet test UndergroundVandals.slnx --no-build -c Release

      - name: Publish API and bot packages
        working-directory: backend/UndergroundVandals
        run: |
          dotnet publish UndergroundVandals.Api/UndergroundVandals.Api.csproj --no-restore -c Release -o "$RELEASE_DIR/api" /p:UseAppHost=false
          dotnet publish UndergroundVandals.Bot/UndergroundVandals.Bot.csproj --no-restore -c Release -o "$RELEASE_DIR/bot" /p:UseAppHost=false

      - name: Build migration bundle without production credentials
        working-directory: backend/UndergroundVandals
        env:
          ASPNETCORE_ENVIRONMENT: Production
          JwtSettings__Secret: migration-design-time-placeholder-not-used-by-the-deployed-app
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=1;Database=unused;Username=unused;Password=unused
        run: |
          dotnet tool run dotnet-ef migrations bundle \
            --project UndergroundVandals.Api \
            --startup-project UndergroundVandals.Api \
            --configuration Release --no-build \
            --self-contained -r linux-x64 \
            --output "$RELEASE_DIR/efbundle" --force
          cp "$RELEASE_DIR/api/appsettings.json" "$RELEASE_DIR/appsettings.json"
          printf '%s\n' "$GITHUB_SHA" > "$RELEASE_DIR/commit.txt"

      - name: Verify release identity
        run: |
          [[ "$(cat "$RELEASE_DIR/commit.txt")" == "$GITHUB_SHA" ]]
          test -s "$RELEASE_DIR/api/UndergroundVandals.Api.dll"
          test -s "$RELEASE_DIR/bot/UndergroundVandals.Bot.dll"
          test -s "$RELEASE_DIR/efbundle"

      - name: Back up Neon and verify a private remote copy
        id: backup
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: bash .github/scripts/backup-production.sh

      - name: Apply approved migration bundle
        working-directory: ${{ env.RELEASE_DIR }}
        env:
          ASPNETCORE_ENVIRONMENT: Production
          JwtSettings__Secret: migration-design-time-placeholder-not-used-by-the-deployed-app
          ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          chmod u+x ./efbundle
          ./efbundle

      - name: Deploy API to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: underground-vandals-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.RELEASE_DIR }}/api

      - name: Verify API readiness
        run: |
          deadline=$((SECONDS + 300))
          status=000
          while (( SECONDS < deadline )); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 15 "$API_BASE_URL/healthz" || true)
            if [[ "$status" == "200" ]]; then
              echo "API readiness verified (HTTP 200)."
              exit 0
            fi
            echo "API is not ready yet (HTTP $status); retrying in 10 seconds."
            sleep 10
          done
          echo "API did not become ready within 300 seconds (last HTTP status: $status)." >&2
          exit 1

      - name: Deploy bot to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: underground-vandals-bot
          publish-profile: ${{ secrets.AZURE_BOT_PUBLISH_PROFILE }}
          package: ${{ env.RELEASE_DIR }}/bot

      - name: Verify bot readiness
        run: |
          deadline=$((SECONDS + 300))
          status=000
          while (( SECONDS < deadline )); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 15 "$BOT_BASE_URL/healthz" || true)
            if [[ "$status" == "200" ]]; then
              echo "Bot readiness verified (HTTP 200)."
              exit 0
            fi
            echo "Bot is not ready yet (HTTP $status); retrying in 10 seconds."
            sleep 10
          done
          echo "Bot did not become ready within 300 seconds (last HTTP status: $status)." >&2
          exit 1

      - name: Set up Node for Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Promote matching frontend deployment to Vercel production
        id: promote_frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'
          GITHUB_SHA: ${{ github.sha }}
        run: bash .github/scripts/promote-vercel-production.sh

      - name: Summarize production result
        if: always()
        env:
          RELEASE_STATUS: ${{ job.status }}
          BACKUP_BLOB: ${{ steps.backup.outputs.blob }}
          BACKUP_STATUS: ${{ steps.backup.outcome }}
          VERCEL_PROMOTION_STATUS: ${{ steps.promote_frontend.outcome }}
          VERCEL_DEPLOYMENT_URL: ${{ steps.promote_frontend.outputs.deployment_url }}
        run: |
          {
            echo "## Production release"
            echo "Result: $RELEASE_STATUS"
            echo "Commit: $GITHUB_SHA"
            echo "Release packages were built and used locally on this runner; no GitHub artifact storage was used."
            echo "Backup verification: $BACKUP_STATUS"
            echo "Backup container: db-backups"
            echo "Backup blob: $BACKUP_BLOB"
            echo "Vercel frontend promotion: $VERCEL_PROMOTION_STATUS"
            echo "Vercel deployment: $VERCEL_DEPLOYMENT_URL"
            if [[ "$RELEASE_STATUS" == "success" ]]; then
              echo "The API, bot, and matching Vercel frontend deployment completed successfully."
              echo "Bot HTTP readiness does not verify Telegram connectivity or storage deletion."
            else
              echo "Production may be partially updated; inspect the failed step before retrying."
              echo "There is no automatic application or database rollback."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary release files
        if: always()
        run: |
          expected="$RUNNER_TEMP/production-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "${RELEASE_DIR:-}" == "$expected" && -d "$RELEASE_DIR" ]]; then
            rm -rf -- "$RELEASE_DIR"
          fi
